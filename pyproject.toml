[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tracecause"
version = "0.1.0"
description = "Evidence-grounded incident investigation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "neo4j>=5.28,<7",
  "httpx>=0.28,<1",
  "structlog>=25,<27",
  "prometheus-client>=0.21,<1",
  "pyyaml>=6,<7",
  "markdown-it-py>=3,<5",
  "python-multipart>=0.0.20,<1",
  "tokenizers==0.23.3",
]

[project.scripts]
tracecause = "tracecause.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "hypothesis>=6,<7",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "respx>=0.22,<1",
  "jsonschema>=4.23,<5",
  "types-pyyaml>=6.0,<7",
]
ml = [
  "numpy>=2.1,<3",
  "scikit-learn>=1.6,<2",
  "sentence-transformers>=3.4,<6",
  "torch>=2.6,<3",
  "transformers>=4.51,<6",
  "huggingface-hub>=0.30,<2",
]
capture = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
  "opentelemetry-instrumentation-httpx>=0.51b0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tracecause"]

[tool.uv]
required-version = ">=0.11.19,<0.12"
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["tracecause"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
