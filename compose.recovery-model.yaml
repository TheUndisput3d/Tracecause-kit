# Local diagnostic runtime already cached on this host; release still uses .env pin.
name: tracecause-recovery-model-v1
services:
  ollama:
    image: ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ./reports/phase16-model-store:/models
      - /usr/share/ollama/.ollama/models/blobs:/models/blobs:ro
    ports: ["127.0.0.1:21434:11434"]
    mem_limit: 6g
    cpus: 4.0
