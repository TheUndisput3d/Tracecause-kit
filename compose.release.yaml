name: tracecause-release

x-app-env: &app-env
  TRACECAUSE_PG_HOST: postgres
  TRACECAUSE_PG_PORT: "5432"
  TRACECAUSE_PG_DATABASE: tracecause
  TRACECAUSE_PG_USER: tracecause_app
  TRACECAUSE_PG_PASSWORD_FILE: /run/secrets/postgres_password
  TRACECAUSE_NEO4J_URI: bolt://neo4j:7687
  TRACECAUSE_NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
  TRACECAUSE_OPERATOR_TOKEN_FILE: /run/secrets/operator_token
  TRACECAUSE_ARTIFACT_ROOT: /var/lib/tracecause/artifacts
  TRACECAUSE_STAGING_ROOT: /var/lib/tracecause/staging
  TRACECAUSE_GENERATION_PROVIDER: ${GENERATION_PROVIDER:-template}
  TRACECAUSE_PUBLIC_READ_ONLY: ${PUBLIC_READ_ONLY:-true}
  TRACECAUSE_OLLAMA_URL: http://ollama:11434
  TRACECAUSE_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
  TRACECAUSE_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
  TRACECAUSE_EMBEDDING_REVISION: ${EMBEDDING_REVISION:?Resolve embedding revision}
  HF_HOME: /var/cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

x-app-base: &app-base
  image: ${APP_IMAGE:?Build and select immutable backend image}
  build:
    context: .
    dockerfile: Dockerfile.backend
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:?Resolve Python image digest}
      UV_IMAGE: ${UV_IMAGE:?Resolve uv image digest}
      VCS_REF: ${VCS_REF:?Set source revision}
      RELEASE_VERSION: ${RELEASE_VERSION:?Set release version}
  environment: *app-env
  user: "10001:10001"
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  secrets: [postgres_password, neo4j_auth, operator_token]
  networks: [app_net, data_net]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Resolve PostgreSQL 17 image digest}
    environment:
      POSTGRES_DB: tracecause
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password, postgres_password]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/001-app-user.sh:/docker-entrypoint-initdb.d/001-app-user.sh:ro
    networks: [data_net]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d tracecause"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped

  neo4j:
    image: ${NEO4J_IMAGE:?Resolve Neo4j Community image digest}
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
      NEO4J_server_memory_heap_initial__size: 768m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 512m
    secrets: [neo4j_auth]
    volumes: [neo4j_data:/data, neo4j_logs:/logs]
    networks: [data_net]
    healthcheck:
      test: [CMD-SHELL, 'auth=$$(cat /run/secrets/neo4j_auth); cypher-shell -u "$${auth%%/*}" -p "$${auth#*/}" "RETURN 1" >/dev/null']
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 45s
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped

  api:
    <<: *app-base
    command: [uvicorn, tracecause.api.main:app, --host, 0.0.0.0, --port, "8000", --workers, "1"]
    volumes: [artifacts:/var/lib/tracecause/artifacts:ro, staging:/var/lib/tracecause/staging, hf_cache:/var/cache/huggingface:ro]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped

  worker:
    <<: *app-base
    profiles: [operator]
    command: [python, -m, tracecause.jobs.api_worker]
    volumes: [artifacts:/var/lib/tracecause/artifacts, staging:/var/lib/tracecause/staging, hf_cache:/var/cache/huggingface:ro]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, tracecause.operations, worker-health]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 30s
    stop_grace_period: 210s
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped

  web:
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      TLS_CONFIG: ${TLS_CONFIG:-}
      WEB_HEALTH_URL: ${WEB_HEALTH_URL:-http://127.0.0.1:8080/health/live}
    healthcheck:
      test: [CMD-SHELL, 'wget --spider --no-check-certificate -q "$${WEB_HEALTH_URL}"']
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 20s
    image: ${WEB_IMAGE:?Build and select immutable web image}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Resolve Node LTS image digest}
        CADDY_IMAGE: ${CADDY_IMAGE:?Resolve Caddy image digest}
        VCS_REF: ${VCS_REF:?Set source revision}
        RELEASE_VERSION: ${RELEASE_VERSION:?Set release version}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:${LOCAL_WEB_PORT:-13000}:8080"]
    networks: [app_net]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped

  ollama:
    profiles: [llm]
    image: ${OLLAMA_IMAGE:?Resolve Ollama image digest}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    networks: [app_net]
    volumes: [ollama_models:/root/.ollama]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 6g
    cpus: 4.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped

  migrate:
    <<: *app-base
    profiles: [tools]
    command: [python, -m, tracecause.operations, migrate]
    environment:
      <<: *app-env
      TRACECAUSE_PG_USER: postgres
      TRACECAUSE_PG_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password, postgres_password, neo4j_auth, operator_token]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    restart: "no"

  volume-init:
    profiles: [tools]
    image: ${APP_IMAGE:?Build and select immutable backend image}
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    volumes: [artifacts:/var/lib/tracecause/artifacts, staging:/var/lib/tracecause/staging, hf_cache:/var/cache/huggingface]
    entrypoint: [chown, "10001:10001", /var/lib/tracecause/artifacts, /var/lib/tracecause/staging, /var/cache/huggingface]
    healthcheck: {disable: true}
    restart: "no"

  seed:
    <<: *app-base
    profiles: [tools]
    command: [python, -m, tracecause.operations, seed]
    environment:
      <<: *app-env
      TRACECAUSE_PUBLIC_READ_ONLY: "false"
    volumes: [artifacts:/var/lib/tracecause/artifacts, staging:/var/lib/tracecause/staging, hf_cache:/var/cache/huggingface:ro]
    restart: "no"
    healthcheck: {disable: true}

  models:
    <<: *app-base
    profiles: [tools]
    command: [python, -m, tracecause.operations, prefetch]
    environment:
      <<: *app-env
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    volumes: [hf_cache:/var/cache/huggingface]
    restart: "no"

networks:
  app_net: {}
  data_net: {internal: true}
volumes:
  pg_data: {}
  neo4j_data: {}
  neo4j_logs: {}
  artifacts: {}
  staging: {}
  hf_cache: {}
  ollama_models: {}
  caddy_data: {}
  caddy_config: {}
secrets:
  postgres_admin_password: {file: ./.secrets/release/postgres_admin_password}
  postgres_password: {file: ./.secrets/release/postgres_password}
  neo4j_auth: {file: ./.secrets/release/neo4j_auth}
  operator_token: {file: ./.secrets/release/operator_token}
